[build]
  command = "CI=false yarn build"
  publish = "build"

[functions]
  directory = "netlify/functions"

[build.environment]
  CI = "false"
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "WORKSIDE_EMAIL_PROVIDER"

# SPA redirects - handle client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Specific redirects for assets (ensure they're served correctly)
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"


